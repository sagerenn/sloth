[package]
name = "sloth-agent"
version = "0.1.0"
edition = "2024"
description = "Rust AI agent bridging the OpenClaw WebSocket bridge to an OpenAI-compatible chat completion backend"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"

[dev-dependencies]
base64 = "0.22"

[profile.release]
lto = "thin"
