[package]
name = "sloth-agent"
version = "0.1.0"
edition = "2024"
description = "Rust AI agent bridging the OpenClaw WebSocket bridge to an OpenAI-compatible chat completion backend"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
rmcp = { version = "1.8", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
# Official A2A Rust SDK (a2aproject/a2a-rs), vendored under vendor/a2a-rs.
# We use the client crate (a2a-client-lf) for Agent Card discovery + tasks/*.
a2a-client = { package = "a2a-client-lf", path = "vendor/a2a-rs/a2a-client" }
a2a = { package = "a2a-lf", path = "vendor/a2a-rs/a2a" }
url = "2"

[dev-dependencies]
base64 = "0.22"

[profile.release]
lto = "thin"
