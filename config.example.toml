# Sloth agent example configuration. Copy to config.toml and edit.
# Every field below can also be overridden by a SLOTH_* env var.

[bridge]
# WebSocket URL of the OpenClaw bridge.
url = "ws://127.0.0.1:9300/bridge"
# Channel id to subscribe to (matches the plugin's openclaw.plugin.json id).
channel = "liangzimixin"
# Account id within the channel.
account_id = "default"
# Reconnect backoff base (ms) — the loop reconnects with this delay.
reconnect_ms = 1000
# Maximum reconnect backoff (ms).
reconnect_max_ms = 30000
# Heartbeat ping interval (ms). 0 disables.
heartbeat_ms = 25000

[llm]
# OpenAI-compatible base URL.
base_url = "http://172.17.0.1:8317/v1"
# Model id.
model = "glm-5.2"
# Optional API key. Leave unset for the local gateway (it needs none and
# rejects unknown bearer tokens; the SDK sends an empty bearer when unset).
# api_key = ""
system_prompt = "You are Sloth, a friendly, concise AI assistant replying over a chat bridge. Keep replies short and natural."
temperature = 0.7
max_tokens = 1024
timeout_secs = 60

[history]
# Max messages kept per sender (excluding the system prompt).
max_messages = 20

[observability]
# Log format: "text", "pretty", or "json".
log_format = "text"
# tracing filter directive.
log_filter = "info,sloth_agent=debug"
service_name = "sloth-agent"

# ──────────────────────────── remote MCP (hot-reloaded) ────────────────────────────
# [[mcp.servers]] declares a remote MCP server (Streamable HTTP transport).
# The registry hot-reloads when this list changes: add/remove entries and the
# agent reconnects without restarting.
# [[mcp.servers]]
# name = "weather"
# url = "http://127.0.0.1:8080/mcp"
# token = ""            # optional bearer token
# timeout_secs = 10

[mcp]
# Expose each remote server's tools to the LLM as callable functions
# (prefixed mcp_<server>__<tool>). Turn off to hide them from the model.
expose_tools = true
# Poll interval (s) for connectivity checks; 0 = reconnect only on change.
poll_secs = 0

# ──────────────────────────── time-based scheduler ────────────────────────────
[scheduler]
# Enable the cron-style scheduler. When on, scheduled jobs fire their prompts
# into the named session at the cron tick.
enabled = true
# Tick resolution (s). Lower = more responsive, more CPU.
tick_secs = 5
# Session a scheduled prompt runs under when the job specifies none.
default_session = "default"

# ──────────────────────────── session management ────────────────────────────
[sessions]
# Directory for session state metadata.
store_dir = "sessions"
# Session id created on startup.
default_session = "default"

# ──────────────────────────── Human-in-the-Loop ────────────────────────────
[hitl]
# Require human approval before running gated tools (scheduler_*, mcp_*).
enabled = true
# Auto-reject after this many seconds with no human decision.
timeout_secs = 120
# Glob patterns of tool names requiring confirmation. Empty list = confirm all
# gated tools. Examples: ["scheduler_*", "mcp_*"]
confirm_tools = []

# ──────────────────────────── Multi-Tenancy & Access Control ────────────────────────────
# A tenant is an isolation scope derived from the bridge subscription
# (`channel:account_id`). All stateful subsystems — conversation history,
# memory, sessions, and scheduler jobs — are namespaced by the principal
# (tenant + sender), so users never see each other's state.
#
# Access control is role-based (RBAC). Each sender maps to a role; each role
# grants a set of permissions; each tool requires one permission. A caller
# lacking the permission is denied before the tool runs (and before HITL).
# When `enabled = false`, RBAC is off and every principal is authorized
# (single-tenant behavior — the default for existing setups).
[tenancy]
enabled = false
# Default role for senders with no explicit [[tenancy.members]] assignment.
# Builtins: admin | member | guest. Or name a custom role defined below.
default_role = "member"

# Custom roles: a name + the permissions it grants. Permission names:
#   chat, schedule, manage_sessions, use_mcp, use_skills, use_a2a,
#   use_models, use_memory, admin
# [[tenancy.roles]]
# name = "operator"
# permissions = ["chat", "schedule", "use_mcp", "use_models"]

# Per-sender role assignments. `sender` is either a bare sender id (applies
# in every tenant) or a `tenant/sender` scope key (applies only in that
# tenant). The tenant id is `{channel}:{account_id}` (sanitized).
# [[tenancy.members]]
# sender = "alice"            # bare: alice is an admin in every tenant
# role = "admin"
# [[tenancy.members]]
# sender = "mattermost:default/bob"  # tenant-scoped: bob is a guest only here
# role = "guest"

